version: 2

models:
  - name: latest_fundamentals
    description: Latest persisted fundamental snapshot for each ticker and country.
    columns:
      - name: ticker
        data_tests: [not_null]
      - name: country
        data_tests: [not_null]
      - name: snapshot_date
        data_tests: [not_null]

  - name: latest_analysis
    description: Latest flattened analysis snapshot for each symbol and country.
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: country
        data_tests: [not_null]
      - name: run_timestamp
        data_tests: [not_null]

  - name: sector_fundamental_summary
    description: Sector-level summary built from the latest fundamental records.
    columns:
      - name: sector
        data_tests: [not_null, unique]
