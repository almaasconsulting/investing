investing_analytics:
  target: postgresql
  outputs:
    postgresql:
      type: postgres
      host: "{{ env_var('INVESTING_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('INVESTING_POSTGRES_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('INVESTING_POSTGRES_DATABASE', 'investing') }}"
      user: "{{ env_var('INVESTING_POSTGRES_USER', 'investing') }}"
      password: "{{ env_var('INVESTING_POSTGRES_PASSWORD', '') }}"
      schema: "{{ env_var('INVESTING_POSTGRES_SCHEMA', 'main') }}"
      threads: 1
      sslmode: "{{ env_var('INVESTING_POSTGRES_SSLMODE', 'prefer') }}"
